services:
  # PostgreSQL Database Container
  db:
    image: postgres:16-alpine
    container_name: crm_postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm_db}
      POSTGRES_USER: ${POSTGRES_USER:-crm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm_user} -d ${POSTGRES_DB:-crm_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend & APScheduler Container
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: crm_fastapi_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm_user}:${POSTGRES_PASSWORD:-crm_password}@db:5432/${POSTGRES_DB:-crm_db}
      ADMIN_NAME: ${ADMIN_NAME:-Alex Rivera (System Admin)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@company.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-adminpassword}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-sreevedvp2002@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-xsva azun rdsk qcjj}
      EMAIL_FROM: ${EMAIL_FROM:-sreevedvp2002@gmail.com}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Nginx Frontend Container
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: crm_nginx_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:

